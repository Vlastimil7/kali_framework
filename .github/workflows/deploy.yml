name: Deploy DEV

on:
  push:
    branches:
      - main

env:
  DEPLOY_HOST: ${{ secrets.DEV_SSH_HOST }}
  DEPLOY_USER: ${{ secrets.DEV_SSH_USER }}
  DEPLOY_PATH: /var/www/html/kali-framework

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Validate required tools
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "command -v php >/dev/null && command -v composer >/dev/null && command -v npm >/dev/null"

      - name: Ensure deploy path exists
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_PATH"

      - name: Deploy files
        shell: bash
        run: |
          rsync -az --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude=".env.production" \
            --exclude="node_modules/" \
            --exclude="vendor/" \
            --exclude="storage/" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install production dependencies and build assets
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            cd $DEPLOY_PATH &&
            composer install --no-dev --optimize-autoloader &&
            npm ci &&
            npm run build
          "